# code: language=ansible
---
# NTP configuration for Aruba CX switches
#
# This task configures NTP servers and parameters based on NetBox config_context
#
# Required variables in config_context:
#   - ntp_servers: List of NTP servers with optional 'prefer' flag
#   - ntp_vrf: VRF to use for NTP traffic (typically 'mgmt')
#
# Example config_context:
# {
#     "ntp_servers": [
#         {
#             "prefer": "True",
#             "server": "klokke.opdal.net"
#         },
#         {
#             "server": "h1-rpi1.opdal.net"
#         }
#     ],
#     "ntp_vrf": "mgmt"
# }
#
# A config context is often shared by many devices, so ntp_vrf can name a
# VRF a given device does not have (e.g. 'mgmt' on a CX 6000/6100 without an
# out-of-band port). The 'ntp vrf' line is then skipped with a message; the
# servers and 'ntp enable' are still configured and NTP uses the default VRF.
# Available VRFs are determined the same way as for DNS (get_available_vrfs).

- name: configure_ntp | Determine VRFs available on the device
  ansible.builtin.set_fact:
    _ntp_available_vrfs: >-
      {{ interfaces | default([])
         | get_available_vrfs(ip_addresses | default([]), aoscx_vrf_facts | default(None)) }}

- name: configure_ntp | Display NTP configuration debug info
  ansible.builtin.debug:
    msg:
      - "Configuring NTP on {{ inventory_hostname }}"
      - "NTP VRF: {{ ntp_vrf | default('Not configured') }}"
      - "NTP servers: {{ ntp_servers | default([]) | length }} configured"
      - "Available VRFs: {{ _ntp_available_vrfs | join(', ') }}"
  when: aoscx_debug | bool or ansible_verbosity >= 1

- name: configure_ntp | Configure preferred NTP servers
  arubanetworks.aoscx.aoscx_config:
    lines:
      - ntp server {{ item.server }} iburst prefer
    match: line
  loop: "{{ ntp_servers }}"
  when:
    - ntp_servers is defined
    - item.prefer is defined
    - item.prefer | bool
  vars:
    ansible_connection: network_cli

- name: configure_ntp | Configure regular NTP servers
  arubanetworks.aoscx.aoscx_config:
    lines:
      - ntp server {{ item.server }} iburst
    match: line
  loop: "{{ ntp_servers }}"
  when:
    - ntp_servers is defined
    - item.prefer is not defined or not (item.prefer | bool)
  vars:
    ansible_connection: network_cli

- name: configure_ntp | Configure NTP parameters
  arubanetworks.aoscx.aoscx_config:
    lines:
      - ntp enable
      - ntp vrf {{ ntp_vrf }}
    match: line
  when:
    - ntp_vrf is defined
    - ntp_vrf in _ntp_available_vrfs
  vars:
    ansible_connection: network_cli

- name: configure_ntp | Enable NTP without VRF (ntp_vrf not on device)
  arubanetworks.aoscx.aoscx_config:
    lines:
      - ntp enable
    match: line
  when:
    - ntp_vrf is defined
    - ntp_vrf not in _ntp_available_vrfs
  vars:
    ansible_connection: network_cli

- name: configure_ntp | Report skipped NTP VRF
  ansible.builtin.debug:
    msg: >-
      Skipping 'ntp vrf {{ ntp_vrf }}' on {{ inventory_hostname }}:
      VRF '{{ ntp_vrf }}' does not exist on this device
      (available: {{ _ntp_available_vrfs | join(', ') }}); NTP uses the default VRF
  when:
    - ntp_vrf is defined
    - ntp_vrf not in _ntp_available_vrfs
