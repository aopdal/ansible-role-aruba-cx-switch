---
# Verify playbook for Molecule testing
#
# PURPOSE (deliberately narrow): this scenario has no real AOS-CX device or
# simulator, so it cannot exercise any arubanetworks.aoscx module, CLI
# push, or actual idempotency. converge.yml also disables every
# aoscx_configure_* flag, so tasks/main.yml's own config-push task files
# are never even included here. What this playbook CAN prove, and the only
# thing it's for, is that filter_plugins/netbox_filters.py's FilterModule
# (and filter_plugins/rest_api_transforms.py) are actually discovered and
# loaded by Ansible's real plugin loader when the role is included by its
# Galaxy name - a different code path than pytest's sys.path + import
# (see tests/unit/test_netbox_filters.py, which proves the Python-import
# side of the same guarantee).
#
# This is intentionally a loader/registration smoke test, not a behavior
# test: each filter below is called once with minimal, defensively-safe
# input and only checked for "didn't error / returned the expected type".
# Filter *behavior* (edge cases, VLAN diff logic, idempotency branches,
# etc.) is the pytest suite's job (tests/unit/) - it covers this far more
# thoroughly than a duplicate set of Jinja assertions here ever could.
- name: Verify
  hosts: all
  gather_facts: false

  vars:
    # Disable ALL configuration - this play only needs the filters loaded
    aoscx_gather_facts: false
    aoscx_configure_hostname: false
    aoscx_configure_banner: false
    aoscx_configure_ntp: false
    aoscx_configure_timezone: false
    aoscx_configure_dns: false
    aoscx_configure_vrfs: false
    aoscx_configure_vlans: false
    aoscx_configure_physical_interfaces: false
    aoscx_configure_lag_interfaces: false
    aoscx_configure_mclag_interfaces: false
    aoscx_configure_l2_interfaces: false
    aoscx_configure_l3_interfaces: false
    aoscx_configure_evpn: false
    aoscx_configure_vxlan: false
    aoscx_configure_ospf: false
    aoscx_configure_bgp: false
    aoscx_configure_vsx: false
    aoscx_save_config: false

  roles:
    # Include the role purely so Ansible's plugin loader resolves
    # filter_plugins/*.py - nothing here actually gets configured.
    - role: aopdal.aruba_cx_switch

  tasks:
    # One representative filter per netbox_filters_lib module (mirrors the
    # module list in tests/unit/test_netbox_filters.py), each called with
    # the smallest input its guard clauses accept without erroring.
    - name: "Loader smoke test: collapse_vlan_list (utils)"
      ansible.builtin.assert:
        that:
          - ([10, 20, 30] | collapse_vlan_list) == '10,20,30'

    - name: "Loader smoke test: get_vlans_in_use (vlan_filters)"
      ansible.builtin.assert:
        that:
          - ([] | get_vlans_in_use) is mapping

    - name: "Loader smoke test: get_vrf_changes (vrf_filters)"
      ansible.builtin.assert:
        that:
          - ([] | get_vrf_changes({})) is mapping

    - name: "Loader smoke test: categorize_l2_interfaces (interface_categorization)"
      ansible.builtin.assert:
        that:
          - ([] | categorize_l2_interfaces) is mapping

    - name: "Loader smoke test: get_interface_ip_addresses (interface_ip_processing)"
      ansible.builtin.assert:
        that:
          - ([] | get_interface_ip_addresses([])) is iterable

    - name: "Loader smoke test: get_interfaces_needing_config_changes (interface_change_detection)"
      ansible.builtin.assert:
        that:
          - ([] | get_interfaces_needing_config_changes({})) is mapping

    - name: "Loader smoke test: compare_interface_vlans (comparison)"
      ansible.builtin.assert:
        that:
          - ({} | compare_interface_vlans({})) is mapping

    - name: "Loader smoke test: get_ospf_router_changes (ospf_filters)"
      ansible.builtin.assert:
        that:
          - ({} | get_ospf_router_changes) is mapping

    - name: "Loader smoke test: is_ipv4_address (l3_config_helpers)"
      ansible.builtin.assert:
        that:
          - ('10.0.0.1' | is_ipv4_address) is sameas true

    - name: "Loader smoke test: get_bgp_session_vrf_info (bgp_filters)"
      ansible.builtin.assert:
        that:
          - ([] | get_bgp_session_vrf_info([])) is iterable

    - name: "Loader smoke test: port_access_diff (port_access)"
      ansible.builtin.assert:
        that:
          - ({} | port_access_diff({})) is mapping

    - name: "Loader smoke test: port_access_orphans (port_access_orphans)"
      ansible.builtin.assert:
        that:
          - ({} | port_access_orphans({})) is mapping

    - name: "Loader smoke test: get_virtual_interfaces_to_delete (interface_orphans)"
      ansible.builtin.assert:
        that:
          - ([] | get_virtual_interfaces_to_delete({})) is iterable

    - name: "Loader smoke test: stp_global_config_diff (stp)"
      ansible.builtin.assert:
        that:
          - ({} | stp_global_config_diff({})) is mapping

    - name: "Loader smoke test: vsx_config_diff (vsx)"
      ansible.builtin.assert:
        that:
          - ({} | vsx_config_diff({})) is mapping

    - name: "Loader smoke test: get_static_route_changes (static_route_filters)"
      ansible.builtin.assert:
        that:
          - ({} | get_static_route_changes) is mapping

    # filter_plugins/rest_api_transforms.py is a separate plugin file from
    # netbox_filters.py - check its loader path too, not just the module it
    # re-exports from netbox_filters_lib.
    - name: "Loader smoke test: rest_api_to_aoscx_interfaces (rest_api_transforms)"
      ansible.builtin.assert:
        that:
          - ({} | rest_api_to_aoscx_interfaces) is mapping

    - name: "Loader smoke test: rest_api_to_aoscx_vlans (rest_api_transforms)"
      ansible.builtin.assert:
        that:
          - ({} | rest_api_to_aoscx_vlans) is mapping

    - name: "Display success message"
      ansible.builtin.debug:
        msg: "✅ All role filters loaded and callable via Ansible's plugin loader"
