---
# Molecule configuration for testing the role
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
  enabled: false

driver:
  name: docker

platforms:
  - name: instance
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2404}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      interpreter_python: auto_silent
      roles_path: "${MOLECULE_PROJECT_DIRECTORY}/../..:~/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles"
    ssh_connection:
      pipelining: false
  inventory:
    host_vars:
      instance:
        ansible_user: root
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible

scenario:
  name: default
  # cleanup and side_effect are intentionally omitted: this scenario has no
  # external state to clean up beyond destroy, and no failure/side-effect
  # playbook to simulate between converge and idempotence. Molecule's
  # default sequence includes both; without a cleanup.yml/side_effect.yml
  # playbook they'd otherwise print a benign "Missing playbook" notice on
  # every run.
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
